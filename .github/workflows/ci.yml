name: CI

on:
  push:
  pull_request:

env:
  BSL_LS_VERSION: "1.0.7"

jobs:
  bsl:
    name: Анализ кода 1С
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: BSL Language Server
        run: >
          curl -sSL -o bsl-ls.jar
          https://github.com/1c-syntax/bsl-language-server/releases/download/v${BSL_LS_VERSION}/bsl-language-server-${BSL_LS_VERSION}-exec.jar

      - name: Расширение
        run: |
          mkdir -p report-src
          java -jar bsl-ls.jar --analyze --srcDir src --configuration .bsl-language-server.json --reporter json -o report-src
          python3 scripts/bsl-check.py report-src

      - name: Стенд для тестов
        run: |
          mkdir -p report-stand
          java -jar bsl-ls.jar --analyze --srcDir stand --configuration .bsl-language-server-stand.json --reporter json -o report-stand
          python3 scripts/bsl-check.py report-stand

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff -r requirements.txt

      - name: ruff
        run: |
          ruff check .
          ruff format --check .
